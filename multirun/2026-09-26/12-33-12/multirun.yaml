hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - model=gemma3_270m
    - mode=tool_calling
    - tool_calling=weather
    - prompt=What is the weather in New York, USA?
    - model.source=local
    - model.local_path=/Users/skingsle/Documents/llmbox/models/llms/google/gemma-3-270m-it
  job:
    name: startllm
    chdir: null
    override_dirname: mode=tool_calling,model.local_path=/Users/skingsle/Documents/llmbox/models/llms/google/gemma-3-270m-it,model.source=local,model=gemma3_270m,prompt=What
      is the weather in New York, USA?,tool_calling=weather
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.6
    version_base: '1.3'
    cwd: /Users/skingsle/Documents/llmbox/llm_box
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/skingsle/Documents/llmbox/llm_box/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      tool_calling: weather
      optimizer: adamw
      data: chat_log
      mode: tool_calling
      model: gemma3_270m
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
model:
  name: gemma3_270m_it
  source: local
  model_id: google/gemma-3-270m-it
  local_path: /Users/skingsle/Documents/llmbox/models/llms/google/gemma-3-270m-it
  architecture: gemma3_text
  dtype: bfloat16
  device: auto
  trust_remote_code: false
  supports_tool_calling: false
  supports_structured_output: true
  tool_calling_format: generic
  chat_template_kwargs: {}
  assistant_mask_strategy: verified_prefix
  add_prefix: null
  add_suffix: null
  add_specialtokens: []
mode:
  name: tool_calling
data:
  type: chat_log
  path: ../chat_log
  min_turns: 1
  eval_split: 0.1
  raw_path: null
  original_path: null
  text_columns: []
  target_columns: []
  label_maps: {}
  instruction: ''
  output_dir: null
  train_fraction: null
  split: null
optimizer:
  name: adamw
  learning_rate: 2.0e-05
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  momentum: 0.0
generation:
  max_new_tokens: 512
  temperature: 1.0
  top_p: 0.95
  top_k: 64
  do_sample: true
  repetition_penalty: 1.0
tool_calling:
  enabled: true
  tool_choice: auto
  tools:
  - name: get_current_weather
    description: Get the current weather for a location
    parameters:
      type: object
      properties:
        location:
          type: string
        unit:
          type: string
          enum:
          - celsius
          - fahrenheit
      required:
      - location
structured_output:
  enabled: false
  schema_path: null
  strict: true
training:
  enabled: false
  method: lora
  epochs: 3.0
  batch_size: 2
  grad_accum_steps: 8
  warmup_ratio: 0.03
  max_length: 1024
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  prefix_length: 30
  adapters_dim: 64
  bitfit_bias_params: []
  freeze_modules: []
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  output_dir: ./finetuned
  merge_adapter: false
  token_budget: 1000000
  report_metrics: true
prompt: null
prompt_file: null
username: null
system_prompt: You are a helpful assistant.
seed: 42
output_dir: outputs
metrics: null
