hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model=gemma3_270m
    - model.source=local
    - model.local_path=/Users/skingsle/Documents/llmbox/models/llms/google/gemma-3-270m-it
    - mode=structured_output
    - structured_output.strict=false
    - system_prompt=For each name in the user prompt use the structuredoutput format
      to print the name appropriately but make sure both names have a record
    - prompt=John Smith and Bob Whatever are going to the party
    - structured_output.enabled=true
    - structured_output.schema_path=/Users/skingsle/Documents/llmbox/llm_box/data/pydantic_models/structuredoutput.json
  job:
    name: startllm
    chdir: null
    override_dirname: mode=structured_output,model.local_path=/Users/skingsle/Documents/llmbox/models/llms/google/gemma-3-270m-it,model.source=local,model=gemma3_270m,prompt=John
      Smith and Bob Whatever are going to the party,structured_output.enabled=true,structured_output.schema_path=/Users/skingsle/Documents/llmbox/llm_box/data/pydantic_models/structuredoutput.json,structured_output.strict=false,system_prompt=For
      each name in the user prompt use the structuredoutput format to print the name
      appropriately but make sure both names have a record
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.6
    version_base: '1.3'
    cwd: /Users/skingsle/Documents/llmbox/llm_box
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/skingsle/Documents/llmbox/llm_box/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/skingsle/Documents/llmbox/llm_box/outputs/2026-09-17/09-38-17
    choices:
      optimizer: adamw
      data: chat_log
      mode: structured_output
      model: gemma3_270m
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
